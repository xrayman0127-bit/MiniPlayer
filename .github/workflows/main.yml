name: Build MiniPlayer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Restore signing keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/miniplayer-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Verify restored signing certificate
        run: |
          echo "Keystore size: $(stat -c%s app/miniplayer-release.jks) bytes"
          keytool -list -v -keystore app/miniplayer-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" | grep -E 'Alias name:|Owner:|SHA256:'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}

      - name: Build Release APK
        run: ./gradlew --no-daemon assembleRelease --stacktrace
        env:
          KEYSTORE_FILE: miniplayer-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=1g"
          JAVA_TOOL_OPTIONS: "-Xmx3g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniPlayer-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
